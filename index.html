<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"
    <title>Bewerbunges-Tracker</title>
    <style>
    table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden;
}

th {
    background-color: #1a1a2e;
    color: white;
    padding: 12px 15px;
    text-align: left;
}

td {
    padding: 12px 15px;
    border-bottom: 1px solid #eee;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover td {
    background-color: #f5f5f5;
}

.status-gesendet { background-color: #3498db; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
.status-gespraech { background-color: #f39c12; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
.status-zusage { background-color: #27ae60; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
.status-absage { background-color: #e74c3c; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
.status-wartend { background-color: #95a5a6; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .formular {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.formular h2 {
    margin-top: 0;
    color: #1a1a2e;
}

input {
    padding: 10px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 200px;
    font-size: 14px;
}

button {
    padding: 10px 20px;
    background-color: #1a1a2e;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin: 5px;
}

button:hover {
    background-color: #2d2d5e;
}

    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        padding: 30px;
        color: #333;
    }

    h1 {
        color: #1a1a2e;
        border-bottom: 3px solid #1a1a2e;
        padding-bottom: 10px;
    }
    .btn-loeschen {
    background-color: #e74c3c;
    padding: 5px 10px;
    font-size: 14px;
}

    select {
        padding: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
    }
    .stat-box {
    background-color: white;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    text-align: center;
    font-size: 14px;
    min-width: 80px;
}

.stat-box strong {
    font-size: 24px;
    display: block;
    margin-top: 5px;
    color: #1a1a2e;
}
</style>
</head>
<body> 


    <h1>Mein Bewerbungs-Tracker</h1>
<div class="formular">
    <h2>Neue Bewerbung</h2>
    
    <input type="text" id="unternehmen" placeholder="Unternehmen">
    <input type="text" id="stelle" placeholder="Stelle">
    <input type="text" id="datum" placeholder="Datum (z.B. 14.09.2026)">
    <input type="text" id="notizen" placeholder="Notizen (optional)">
    
    <button onclick="hinzufuegen()">Bewerbung hinzufügen</button>
</div>
<div id="statistik" style="display: flex; gap: 15px; margin-bottom: 20px;"></div>
<div id="tabelle"></div>
<script>
    let bewerbungen = JSON.parse(localStorage.getItem('bewerbungen')) || [];
    // Heutiges Datum automatisch ins Datumsfeld setzen
    let heute = new Date();
    let tag = String(heute.getDate()).padStart(2, '0');
    let monat = String(heute.getMonth() + 1).padStart(2, '0');
    let jahr = heute.getFullYear();
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('datum').value = tag + '.' + monat + '.' + jahr;
    });

    function hinzufuegen() {
        let unternehmen = document.getElementById('unternehmen').value;
        let stelle = document.getElementById('stelle').value;
        let datum = document.getElementById('datum').value;
        let notizen = document.getElementById('notizen').value;

        if (unternehmen === '' || stelle === '') {
            alert('Bitte Unternehmen und Stelle ausfüllen!');
            return;
        }

        let neueBewerbung = {
            id: Date.now(),
            unternehmen: unternehmen,
            stelle: stelle,
            datum: datum || 'kein Datum',
            notizen: notizen || '-',
            status: 'Gesendet'
        };

        bewerbungen.push(neueBewerbung);
        localStorage.setItem('bewerbungen', JSON.stringify(bewerbungen));

        document.getElementById('unternehmen').value = '';
        document.getElementById('stelle').value = '';
        document.getElementById('datum').value = '';
        document.getElementById('notizen').value = '';

        anzeigen();
    }

    function statusAendern(id, neuerStatus) {
        let b = bewerbungen.find(b => b.id == id);
        if (b) {
            b.status = neuerStatus;
            localStorage.setItem('bewerbungen', JSON.stringify(bewerbungen));
            anzeigen();
        }
    }
        let zuLoeschenId = null;

    function loeschen(id) {
        zuLoeschenId = id;
         document.getElementById('modal').style.display = 'block';
    }

function loeschenBestaetigt() {
    bewerbungen = bewerbungen.filter(b => b.id != zuLoeschenId);
    localStorage.setItem('bewerbungen', JSON.stringify(bewerbungen));
    document.getElementById('modal').style.display = 'none';
    anzeigen();
}

    function anzeigen() {
        statistikAnzeigen();
        let bereich = document.getElementById('tabelle');

        if (bewerbungen.length === 0) {
            bereich.innerHTML = '<p>Noch keine Bewerbungen vorhanden.</p>';
            return;
        }

        let html = '<table>';
        html += '<tr><th>Unternehmen</th><th>Stelle</th><th>Datum</th><th>Notizen</th><th>Status</th><th>Ändern</th><th></th></tr>';

        for (let b of bewerbungen) {
            html += '<tr>';
            html += '<td>' + b.unternehmen + '</td>';
            html += '<td>' + b.stelle + '</td>';
            html += '<td>' + b.datum + '</td>';
            html += '<td>' + b.notizen + '</td>';
            let statusKlasse = 'status-' + b.status.toLowerCase().replace('ä', 'a').replace('ö', 'o').replace('ü', 'u').replace(' ', '');
            html += '<td><span class="' + statusKlasse + '">' + b.status + '</span></td>';
            html += '<td><select onchange="statusAendern(' + b.id + ', this.value)">';
            html += '<option value="Gesendet"' + (b.status === "Gesendet" ? " selected" : "") + '>Gesendet</option>';
            html += '<option value="Gespräch"' + (b.status === "Gespräch" ? " selected" : "") + '>Gespräch</option>';
            html += '<option value="Zusage"' + (b.status === "Zusage" ? " selected" : "") + '>Zusage</option>';
            html += '<option value="Absage"' + (b.status === "Absage" ? " selected" : "") + '>Absage</option>';
            html += '<option value="Wartend"' + (b.status === "Wartend" ? " selected" : "") + '>Wartend</option>';
            html += '</select></td>';
            html += '<td><button class="btn-loeschen" onclick="loeschen(' + b.id + ')">🗑️</button></td>';
            html += '</tr>';
        }

        html += '</table>';
        bereich.innerHTML = html;
    }
    function statistikAnzeigen() {
    let gesendet = bewerbungen.filter(b => b.status === 'Gesendet').length;
    let gespraech = bewerbungen.filter(b => b.status === 'Gespräch').length;
    let zusage = bewerbungen.filter(b => b.status === 'Zusage').length;
    let absage = bewerbungen.filter(b => b.status === 'Absage').length;
    let wartend = bewerbungen.filter(b => b.status === 'Wartend').length;

    document.getElementById('statistik').innerHTML = `
        <div class="stat-box">📤 Gesendet<br><strong>${gesendet}</strong></div>
        <div class="stat-box">🗣️ Gespräch<br><strong>${gespraech}</strong></div>
        <div class="stat-box">✅ Zusage<br><strong>${zusage}</strong></div>
        <div class="stat-box">❌ Absage<br><strong>${absage}</strong></div>
        <div class="stat-box">⏳ Wartend<br><strong>${wartend}</strong></div>
        <div class="stat-box">📋 Gesamt<br><strong>${bewerbungen.length}</strong></div>
    `;
}
    anzeigen();
</script>
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:white; padding:30px; border-radius:10px; width:350px; margin:200px auto; text-align:center;">
        <p style="font-size:16px; margin-bottom:20px;">Möchtest du diese Bewerbung wirklich löschen?</p>
        <button onclick="loeschenBestaetigt()" style="background:#e74c3c; color:white; padding:10px 25px; border:none; border-radius:6px; cursor:pointer; margin-right:10px;">Löschen</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background:#95a5a6; color:white; padding:10px 25px; border:none; border-radius:6px; cursor:pointer;">Abbrechen</button>
    </div>
</div>
</body>
</html>
